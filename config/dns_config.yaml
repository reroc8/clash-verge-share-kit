# Clash Verge DNS Config

dns:
  enable: true
  listen: :53
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  prefer-h3: false
  respect-rules: true
  use-hosts: false
  use-system-hosts: false
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - '*.localhost'
  - '*.arpa'
  - time.*.com
  - ntp.*.com
  - +.ntp.org
  - time.windows.com
  - time.apple.com
  - +.market.xiaomi.com
  - localhost.ptlogin2.qq.com
  - localhost.sec.qq.com
  - localhost.work.weixin.qq.com
  - '*.msftncsi.com'
  - www.msftconnecttest.com
  - dns.msftncsi.com
  - captive.apple.com
  - +.stun.*.*
  - +.stun.*.*.*
  - +.stun.*.*.*.*
  - stun.l.google.com
  - +.battlenet.com.cn
  - +.blizzard.cn
  - _tcp.*
  - _udp.*
  - _services._dns-sd._udp.*
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://dns.google/dns-query
  - https://cloudflare-dns.com/dns-query
  nameserver-policy:
    # 不依赖 GEO 数据或外部规则集，避免新机器首次启动时因数据缺失报错。
    # 其它国内直连域名由 respect-rules + direct-nameserver 处理。
    "+.cn":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
  proxy-server-nameserver:
  - https://doh.pub/dns-query
  - https://dns.alidns.com/dns-query
  - tls://223.5.5.5
  direct-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  direct-nameserver-follow-policy: false
hosts: {}
