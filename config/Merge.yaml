# Profile Enhancement Merge Template for Clash Verge

profile:
  store-selected: true

# ── 规则集定义 ──
rule-providers:
  private-domain:
    type: http
    behavior: domain
    format: mrs
    url: "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/private.mrs"
    path: ./ruleset/private-domain.mrs
    interval: 86400
    proxy: Proxies
  private-ip:
    type: http
    behavior: ipcidr
    format: mrs
    url: "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/privateip.mrs"
    path: ./ruleset/private-ip.mrs
    interval: 86400
    proxy: Proxies
  cn-domain:
    type: http
    behavior: domain
    format: mrs
    url: "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/cn.mrs"
    path: ./ruleset/cn-domain.mrs
    interval: 86400
    proxy: Proxies
  cn-ip:
    type: http
    behavior: ipcidr
    format: mrs
    url: "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/cnip.mrs"
    path: ./ruleset/cn-ip.mrs
    interval: 86400
    proxy: Proxies
  tld-proxy:
    type: http
    behavior: domain
    format: mrs
    url: "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/tld-proxy.mrs"
    path: ./ruleset/tld-proxy.mrs
    interval: 86400
    proxy: Proxies
  global-domain:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Global/Global_Domain.yaml"
    path: ./ruleset/global-domain.yaml
    interval: 86400
    proxy: Proxies
  google:
    type: http
    behavior: classical
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Google/Google.yaml"
    path: ./ruleset/google.yaml
    interval: 86400
    proxy: Proxies
  telegramcidr:
    type: http
    behavior: ipcidr
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/telegramcidr.txt"
    path: ./ruleset/telegramcidr.yaml
    interval: 86400
    proxy: Proxies
  apple:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/apple.txt"
    path: ./ruleset/apple.yaml
    interval: 86400
    proxy: Proxies
  icloud:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/icloud.txt"
    path: ./ruleset/icloud.yaml
    interval: 86400
    proxy: Proxies
  applications:
    type: http
    behavior: classical
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/applications.txt"
    path: ./ruleset/applications.yaml
    interval: 86400
    proxy: Proxies

# ── 分流规则 ──
rules:
  # 局域网和私有地址直连
  - RULE-SET,private-domain,DIRECT
  - RULE-SET,private-ip,DIRECT,no-resolve
  # 钉钉进程级强制直连：置于所有业务精确规则之前，钉钉全家桶（DingTalk、
  # DingMeeting 等）的任何连接都不会被后面的精确域名/规则集抢先送进代理。
  # 已知取舍：钉钉内置浏览器打开 AI 等需代理站点时同样直连（无法加载）。
  - PROCESS-NAME-REGEX,(?i)ding(talk|meeting),DIRECT
  # WorkBuddy AI 国际版海外遥测：sg.tgalileo.com 解析到腾讯云新加坡（43.156.86.0/24），
  # 但该域在 cn-domain 规则集里（+.tgalileo.com），按常规会被判为国内直连。前置精确
  # 规则改走代理。取舍：遥测 SNI 由「对 ISP 可见」变为「对代理节点可见」，并非消除；
  # 换来的是 ISP 侧看不到该 SNI，以及海外端点走代理链路的质量。
  # 国内版遥测走 galileotelemetry.tencent.com（命中 cn-domain 的 +.tencent.com），不受影响。
  - DOMAIN-SUFFIX,tgalileo.com,Proxies
  # Lexmount（AI Agent 云浏览器，browser.lexmount.com）：云浏览器服务需海外出口，
  # 该域不在任何规则集内，默认会落到兜底 DIRECT，故前置精确规则。
  - DOMAIN-SUFFIX,lexmount.com,US
  # 订阅服务商面板（vx.wjkc.xyz / www.wjkc.xyz）：解析到 Cloudflare（104.21.x / 172.67.x）。
  # 该域不在任何规则集内，默认落兜底 DIRECT，国内直连 Cloudflare 常被干扰限速（实测 2–15 秒波动）。
  # 前置精确规则改走代理，并固定到台湾组 —— 目标写地区组名而非兜底组，出口可预期。
  - DOMAIN-SUFFIX,wjkc.xyz,TW
  # Meta Muse（个人 AI 代理，2026-09 起仅北美开放）与 muse.ai：进入统一 US-only 的 AI 组。
  # Muse 桌面版实际连的是 graph.facebook.com 等 Meta 域名（走 global-domain 规则集），
  # 按域名无法与服务区分，故用进程名匹配（前缀匹配，以覆盖可能存在的 helper 子进程）；
  # muse.meta.com 为网页版入口。
  - PROCESS-NAME-REGEX,(?i)^muse,AI
  - DOMAIN-SUFFIX,muse.meta.com,AI
  - DOMAIN-SUFFIX,muse.ai,AI
  # Dola（字节豆包海外版，dola.com）：区域锁定，US / CA / AU / 中国大陆均不可用，
  # 主力市场为东南亚与英国。用 SG 地区组，禁用 US 组。
  - DOMAIN-SUFFIX,dola.com,SG
  # PriceAI（priceai.cc，AI 订阅/中转 API 比价雷达）与 982xj.xyz：都是 Cloudflare 站点
  # （104.21.x / 172.67.x），不在任何规则集内，默认落兜底 MATCH,DIRECT；实测国内直连极差
  # （priceai：3 次里 2 次 5 秒超时，成功那次 TLS 5.5s、首字节 11.2s；982xj：3 次里 1 次超时，
  # 成功那次 TLS 1.2–3.1s、首字节 2.6–3.8s，CF-RAY 落 LAX；同域走台湾节点实测 38ms）。
  # 前置精确规则改走 Google + YouTube + Telegram 组——该组恒存在且默认台湾出口，不会因订阅缺地区节点而降级。
  - DOMAIN-SUFFIX,priceai.cc,Google + YouTube + Telegram
  - DOMAIN-SUFFIX,982xj.xyz,Google + YouTube + Telegram
  # Google account / auth / billing share the stable Google + YouTube + Telegram group
  - DOMAIN,accounts.google.com,Google + YouTube + Telegram
  - DOMAIN,myaccount.google.com,Google + YouTube + Telegram
  - DOMAIN,passwords.google.com,Google + YouTube + Telegram
  - DOMAIN,families.google.com,Google + YouTube + Telegram
  - DOMAIN,takeout.google.com,Google + YouTube + Telegram
  - DOMAIN,payments.google.com,Google + YouTube + Telegram
  - DOMAIN,pay.google.com,Google + YouTube + Telegram
  - DOMAIN,wallet.google.com,Google + YouTube + Telegram
  - DOMAIN-SUFFIX,oauth2.googleapis.com,Google + YouTube + Telegram
  - DOMAIN-SUFFIX,oauth2.googleusercontent.com,Google + YouTube + Telegram
  # OpenAI / ChatGPT 的 QUIC 回落：仅拒绝这些 AI 域名的 UDP/443，
  # 让客户端回到 TCP，避免节点或上游对 QUIC 支持不完整时卡在连接阶段。
  # 不做全局 UDP/443 拒绝，避免影响会议、游戏和其它 HTTP/3 流量。
  - AND,((NETWORK,udp),(DST-PORT,443),(DOMAIN-SUFFIX,oaiusercontent.com)),REJECT
  - AND,((NETWORK,udp),(DST-PORT,443),(DOMAIN-SUFFIX,oaistatic.com)),REJECT
  - AND,((NETWORK,udp),(DST-PORT,443),(DOMAIN-SUFFIX,openai.com)),REJECT
  - AND,((NETWORK,udp),(DST-PORT,443),(DOMAIN-SUFFIX,chatgpt.com)),REJECT
  # Claude / Anthropic shares the unified US-only AI group with Codex and OpenAI.
  # Shared Auth0 / Ghost / Cloudflare suffixes are intentionally not used.
  - DOMAIN,anthropic.auth0.com,AI
  - DOMAIN,anthropic-com.ghost.io,AI
  - DOMAIN,anthropic.com.cdn.cloudflare.net,AI
  - DOMAIN,servd-anthropic-website.b-cdn.net,AI
  - DOMAIN-SUFFIX,clau.de,AI
