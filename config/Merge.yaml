  - DOMAIN-SUFFIX,oauth2.googleapis.com,Google
  - DOMAIN-SUFFIX,oauth2.googleusercontent.com,Google
  # Claude is isolated to a US-only group
  # Shared Auth0 / Ghost / Cloudflare suffixes are intentionally not used.
  - DOMAIN,anthropic.auth0.com,Claude
  - DOMAIN,anthropic-com.ghost.io,Claude
  - DOMAIN,anthropic.com.cdn.cloudflare.net,Claude
  - DOMAIN,servd-anthropic-website.b-cdn.net,Claude
