# Profile Enhancement Merge Template for Clash Verge

profile:
  store-selected: true

# ── 规则集定义 ──
rule-providers:
  private-domain:
    type: http
    behavior: domain
    format: mrs
    url: "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/private.mrs"
    path: ./ruleset/private-domain.mrs
    interval: 86400
    proxy: Proxies
  private-ip:
    type: http
    behavior: ipcidr
    format: mrs
    url: "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/privateip.mrs"
    path: ./ruleset/private-ip.mrs
    interval: 86400
    proxy: Proxies
  cn-domain:
    type: http
    behavior: domain
    format: mrs
    url: "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/cn.mrs"
    path: ./ruleset/cn-domain.mrs
    interval: 86400
    proxy: Proxies
  cn-ip:
    type: http
    behavior: ipcidr
    format: mrs
    url: "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/cnip.mrs"
    path: ./ruleset/cn-ip.mrs
    interval: 86400
    proxy: Proxies
  tld-proxy:
    type: http
    behavior: domain
    format: mrs
    url: "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/tld-proxy.mrs"
    path: ./ruleset/tld-proxy.mrs
    interval: 86400
    proxy: Proxies
  global-domain:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Global/Global_Domain.yaml"
    path: ./ruleset/global-domain.yaml
    interval: 86400
    proxy: Proxies
  google:
    type: http
    behavior: classical
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Google/Google.yaml"
    path: ./ruleset/google.yaml
    interval: 86400
    proxy: Proxies
  telegramcidr:
    type: http
    behavior: ipcidr
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/telegramcidr.txt"
    path: ./ruleset/telegramcidr.yaml
    interval: 86400
    proxy: Proxies
  apple:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/apple.txt"
    path: ./ruleset/apple.yaml
    interval: 86400
    proxy: Proxies
  icloud:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/icloud.txt"
    path: ./ruleset/icloud.yaml
    interval: 86400
    proxy: Proxies
  applications:
    type: http
    behavior: classical
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/applications.txt"
    path: ./ruleset/applications.yaml
    interval: 86400
    proxy: Proxies

# ── 分流规则 ──
rules:
  # 局域网和私有地址直连
  - RULE-SET,private-domain,DIRECT
  - RULE-SET,private-ip,DIRECT,no-resolve
  # Google account / auth / billing stay on the stable Google group
  - DOMAIN,accounts.google.com,Google
  - DOMAIN,myaccount.google.com,Google
  - DOMAIN,passwords.google.com,Google
  - DOMAIN,families.google.com,Google
  - DOMAIN,takeout.google.com,Google
  - DOMAIN,payments.google.com,Google
  - DOMAIN,pay.google.com,Google
